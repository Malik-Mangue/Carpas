<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas — Lições</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <span class="navbar-brand mb-0 h1">Carpas — Lições</span>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Lições</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Listagem de Lições</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Formador</th>
                <th>Turma</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Nova Lição</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="titulo-licao">Título <span class="required">*</span></label>
                <input type="text" id="titulo-licao" name="titulo" class="form-control" maxlength="200" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="duracao-licao">Duração (minutos)</label>
                <input type="number" id="duracao-licao" name="duracao" class="form-control" min="1">
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="formador-licao">Formador</label>
                <select id="formador-licao" name="formador" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="1">Ana Silva</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Lição</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script ./licao.js"></script>
</body>
</html>
