<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas — Formadores</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <span class="navbar-brand mb-0 h1">Carpas — Gestão de Formadores</span>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Formadores</h2>
      <button type="button" class="btn btn-primary" id="btn-novo-formador">
        + Novo Formador
      </button>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="form-group mb-3">
          <input
            type="text"
            class="form-control"
            id="pesquisa-formador"
            placeholder="Pesquisar por nome, email ou especialidade..."
          >
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0" id="tabela-formadores">
            <thead class="thead-light">
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Especialidade</th>
                <th>Estado</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modal-formador" tabindex="-1" role="dialog" aria-labelledby="modal-formador-titulo" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <form id="form-formador" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="modal-formador-titulo">Novo Formador</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="formador-id">
            <div class="form-group">
              <label for="formador-nome">Nome completo</label>
              <input type="text" class="form-control" id="formador-nome" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="form-group">
              <label for="formador-email">Email</label>
              <input type="email" class="form-control" id="formador-email" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="form-group">
              <label for="formador-telefone">Telefone</label>
              <input type="text" class="form-control" id="formador-telefone" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="form-group">
              <label for="formador-especialidade">Especialidade</label>
              <input type="text" class="form-control" id="formador-especialidade" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="form-group mb-0">
              <label for="formador-estado">Estado</label>
              <select class="form-control" id="formador-estado">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./formadores.js"></script>
</body>
</html>
