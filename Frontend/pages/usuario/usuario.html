<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas - Utilizadores</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <span class="navbar-brand mb-0 h1">Carpas - Utilizadores</span>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Utilizadores</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Listagem de Utilizadores</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Função</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Admin</td>
                <td>admin@carpas.pt</td>
                <td>Administrador</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Formador</td>
                <td>formador@carpas.pt</td>
                <td>Formador</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Novo Utilizador</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="usuario-nome">Nome Completo <span class="required">*</span></label>
                <input type="text" id="usuario-nome" name="nome" class="form-control" maxlength="100" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="usuario-email">E-mail <span class="required">*</span></label>
                <input type="email" id="usuario-email" name="email" class="form-control" maxlength="100" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="usuario-funcao">Função <span class="required">*</span></label>
                <select id="usuario-funcao" name="funcao" class="form-control" required>
                  <option value="">-- Selecionar --</option>
                  <option value="admin">Administrador</option>
                  <option value="formador">Formador</option>
                  <option value="utilizador">Utilizador</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Utilizador</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script ./usuario.js></script>
</body>
</html>
