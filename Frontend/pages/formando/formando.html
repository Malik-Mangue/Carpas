<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas — Formando</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="header"></div>
  <div class="d-flex" style="display: flex;">
    <div id="sidebar"></div>

  <main class="container" style="flex: 1;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Formandos</h2>
      <button type="button" class="btn btn-primary" id="btn-novo-formando">
        + Novo formando
      </button>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Listagem de Formandos</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Formador</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Novo Formando</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="formando-nome">Nome <span class="required">*</span></label>
                <input type="text" id="formando-nome" name="nome" class="form-control" maxlength="100" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="formador-selecionado">Formador responsável</label>
                <select id="formador-selecionado" name="formador" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="1">Ana Silva</option>
                  <option value="2">Carlos Mendes</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Formando</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  </div>
  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./formando.js"></script>
</body>
</html>
