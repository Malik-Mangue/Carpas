<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas — Dashboard</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="header"></div>
  <div id="sidebar"></div>

  <main class="container">
    <div class="row">
      <div class="col-md-6 col-lg-3 mb-4">
        <div class="card text-white bg-primary o-1">
          <div class="card-header">Formadores</div>
          <div class="card-body">
            <h5 class="card-title">12</h5>
            <p class="card-text">Total de formadores</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3 mb-4">
        <div class="card text-white bg-success o-1">
          <div class="card-header">Turmas</div>
          <div class="card-body">
            <h5 class="card-title">45</h5>
            <p class="card-text">Total de turmas</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3 mb-4">
        <div class="card text-white bg-info o-1">
          <div class="card-header">Qualificações</div>
          <div class="card-body">
            <h5 class="card-title">30</h5>
            <p class="card-text">Total de qualificações</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3 mb-4">
        <div class="card text-white bg-warning o-1">
          <div class="card-header">Utilizadores</div>
          <div class="card-body">
            <h5 class="card-title">200</h5>
            <p class="card-text">Total de utilizadores</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
