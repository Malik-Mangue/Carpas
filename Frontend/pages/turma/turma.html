<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas - Turmas</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="d-flex flex-column flex-md-row min-vh-100">
    <div id="sidebar"></div>
    <div class="app-column flex-grow-1 d-flex flex-column">
      <div id="header"></div>
      <main class="app-main flex-grow-1 p-3 p-md-4 p-xl-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Turmas</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Listagem de Turmas</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Formador</th>
                <th>Nível</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Nova Turma</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="turma-nome">Nome <span class="required">*</span></label>
                <input type="text" id="turma-nome" name="nome" class="form-control" maxlength="100" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="turma-nivel">Nível</label>
                <select id="turma-nivel" name="nivel" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="1">1º Ano</option>
                  <option value="2">2º Ano</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="turma-formador">Formador</label>
                <select id="turma-formador" name="formador" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="1">Ana Silva</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Turma</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  
      </main>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="./turma.js"></script>
</body>
</html>
