<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas — Inscrição</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="sidebar"></div>
  <div id="header"></div>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Inscrições</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Listagem de Inscrições</h2>
      </div>
      <div class="card-body">
        <form method="get" action="inscricao.html" class="form-actions">
          <div class="form-group">
            <label for="pesquisa-inscricao">Pesquisar</label>
            <input type="text" id="pesquisa-inscricao" name="pesquisa" class="form-control"
                   placeholder="Nome do formando, nome da turma...">
          </div>
          <button type="submit" class="btn btn-primary">Filtrar</button>
        </form>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Formando</th>
                <th>Turma</th>
                <th>Data Inscrição</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Nova Inscrição</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="formando-inscricao">Formando <span class="required">*</span></label>
                <select id="formando-inscricao" name="formando" class="form-control" required>
                  <option value="">-- Selecionar --</option>
                  <option value="1">João Silva</option>
                  <option value="2">Maria Santos</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="turma-inscricao">Turma <span class="required">*</span></label>
                <select id="turma-inscricao" name="turma" class="form-control" required>
                  <option value="">-- Selecionar --</option>
                  <option value="1">1º Ano A</option>
                  <option value="2">2º Ano B</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="data-inscricao">Data Inscrição</label>
                <input type="date" id="data-inscricao" name="data" class="form-control">
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Gravar Inscrição</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./inscricao.js"></script>
</body>
</html>
