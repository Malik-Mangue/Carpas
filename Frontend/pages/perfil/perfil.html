<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas - Perfil</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="sidebar"></div>
  <div id="header"></div>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Perfil do Utilizador</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Meu Perfil</h2>
      </div>
      <div class="card-body">
        <form method="post" action="#">
          <div class="form-group">
            <label for="nome-perfil">Nome Completo</label>
            <input type="text" id="nome-perfil" name="nome" class="form-control" placeholder="Ex: João Silva">
          </div>
          <div class="form-group">
            <label for="email-perfil">E-mail</label>
            <input type="email" id="email-perfil" name="email" class="form-control" placeholder="ex: joao@email.com">
          </div>
          <div class="form-group">
            <label for="telefone-perfil">Telefone</label>
            <input type="text" id="telefone-perfil" name="telefone" class="form-control" placeholder="Ex: 912345678">
          </div>
          <div class="form-group">
            <label for="funcao-perfil">Função</label>
            <select id="funcao-perfil" name="funcao" class="form-control">
              <option value="admin">Administrador</option>
              <option value="formador">Formador</option>
              <option value="utilizador">Utilizador</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Atualizar Perfil</button>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./perfil.js"></script>
</body>
</html>
