<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas - Permissões</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <span class="navbar-brand mb-0 h1">Carpas - Permissões</span>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Permissões</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Lista de Permissões</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Utilizador</th>
                <th>Permissão</th>
                <th>Recurso</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Admin</td>
                <td>Completa</td>
                <td>Todos</td>
                <td><button class="btn btn-sm btn-primary">Detalhes</button></td>
              </tr>
              <tr>
                <td>Formador</td>
                <td>Limited</td>
                <td>Só formadores</td>
                <td><button class="btn btn-sm btn-primary">Detalhes</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Nova Permissão</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="utilizador-permissao">Utilizador</label>
                <select id="utilizador-permissao" name="utilizador" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="1">Admin</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="recurso-permissao">Recurso</label>
                <select id="recurso-permissao" name="recurso" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="formadores">Formadores</option>
                  <option value="turmas">Turmas</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="nivel-permissao">Nível</label>
                <select id="nivel-permissao" name="nivel" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="ler">Ler</option>
                  <option value="escrever">Escrever</option>
                  <option value="excluir">Excluir</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Permissão</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script ./permissoes.js"></script>
</body>
</html>
