<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carpas - Matrícula</title>
  <link rel="stylesheet" href="../../public/libs/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="header"></div>
  <div class="d-flex" style="display: flex;">
    <div id="sidebar"></div>

  <main class="container" style="flex: 1;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Matrícula</h2>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h2>Matrícula de Formandos</h2>
      </div>
      <div class="card-body">
        <form method="get" action="matricula.html" class="form-actions">
          <div class="form-group">
            <label for="pesquisa-matricula">Pesquisar</label>
            <input type="text" id="pesquisa-matricula" name="pesquisa" class="form-control"
                   placeholder="Nome do formando, nome da turma">
          </div>
          <button type="submit" class="btn btn-primary">Filtrar</button>
        </form>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Formando</th>
                <th>Turma</th>
                <th>Ano Letivo</th>
                <th>Turno</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-novo" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modal-novo-titulo" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form method="post" action="#">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-novo-titulo">Nova Matrícula</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="formando-matricula">Formando <span class="required">*</span></label>
                <select id="formando-matricula" name="formando" class="form-control" required>
                  <option value="">-- Selecionar --</option>
                  <option value="1">João Silva</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="turma-matricula">Turma <span class="required">*</span></label>
                <select id="turma-matricula" name="turma" class="form-control" required>
                  <option value="">-- Selecionar --</option>
                  <option value="1">1º Ano A</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="ano-letivo-matricula">Ano Letivo</label>
                <input type="text" id="ano-letivo-matricula" name="ano_letivo" class="form-control"
                       placeholder="Ex: 2024/2025">
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="turno-matricula">Turno</label>
                <select id="turno-matricula" name="turno" class="form-control">
                  <option value="">-- Selecionar --</option>
                  <option value="Manhã">Manhã</option>
                  <option value="Tarde">Tarde</option>
                  <option value="Noite">Noite</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Gravar Matrícula</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  </div>
  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../public/libs/js/bootstrap.bundle.min.js"></script>
  <script src="./matricula.js"></script>
</body>
</html>
