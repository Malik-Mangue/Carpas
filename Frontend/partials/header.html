<!--
  partial: header
  Injetado por src/js/partials.js.
  O placeholder {{root}} é substituído pelo caminho relativo da página
  (definido em <body data-root="...">), para os assets funcionarem a qualquer profundidade.
-->
<nav class="navbar navbar-expand navbar-dark app-topbar fixed-top">
    <button class="btn btn-link text-white d-lg-none mr-2 p-1" id="sidebarToggle" type="button"
            aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
        <svg class="icon"><use href="#i-menu"></use></svg>
    </button>

    <a class="navbar-brand d-flex align-items-center" href="{{root}}index.html#dashboard">
        <img src="{{root}}public/img/logo.png" alt="CARPAS" height="30" class="mr-2"
             onerror="this.style.display='none'">
        <span class="font-weight-bold">CARPAS</span>
        <span class="badge badge-light badge-pill ml-2 d-none d-sm-inline">Gestão Académica</span>
    </a>

    <span class="navbar-text mx-auto d-none d-md-block small">Sistema de Gestão Académica</span>

    <div class="d-flex align-items-center ml-auto ml-md-0">
        <button class="btn btn-link text-white-50 mr-1 p-1 d-none d-sm-inline" type="button" title="Notificações">
            <svg class="icon"><use href="#i-bell"></use></svg>
        </button>

        <div class="d-flex align-items-center mr-2 mr-sm-3">
            <span class="avatar-mini mr-2">
                <svg class="icon icon-sm"><use href="#i-usuario"></use></svg>
            </span>
            <span class="text-white small d-none d-sm-inline">Administrador</span>
            <span class="badge badge-info ml-2 d-none d-md-inline">Admin</span>
        </div>

        <a href="{{root}}index.html" class="btn btn-outline-light btn-sm" title="Terminar sessão">
            <svg class="icon icon-sm mr-1"><use href="#i-logout"></use></svg>
            <span class="d-none d-sm-inline">Sair</span>
        </a>
    </div>
</nav>
