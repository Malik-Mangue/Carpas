<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CARPAS &middot; Sistema de Gestão Académica</title>

    <!-- Bootstrap 4 (local) -->
    <link rel="stylesheet" href="./public/libs/bootstrap/css/bootstrap.min.css">
    <!-- Layout do painel -->
    <link rel="stylesheet" href="./src/css/dashboard.css">
</head>

<body data-page="dashboard" data-root="./">

    <!-- Partials (header, sidebar, footer) injetados por src/js/partials.js -->
    <div data-include="{{root}}partials/header.html"></div>
    <div data-include="{{root}}partials/sidebar.html"></div>

    <!-- Aqui entra a página (ver src/main.js → PageLoad.js) -->
    <div id="app"></div>

    <div data-include="{{root}}partials/footer.html"></div>

    <!-- jQuery -->
    <script src="./public/libs/jquery/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="./public/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Injeta os partials -->
    <script src="./src/js/partials.js" defer></script>

    <!-- Js Principal (carrega o dashboard no #app) -->
    <script type="module" src="./src/main.js"></script>
</body>

</html>
